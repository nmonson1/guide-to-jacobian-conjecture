name: Check filtered operation complex

on:
  pull_request:
    paths:
      - 'research-tools/filtered_operation_complex/**'
      - 'research-notes/p6-chart-correspondence/synthetic_k4_contract.json'
      - '.github/workflows/filtered-operation-complex.yml'
  push:
    branches: [agent/p6-chart-correspondence]
    paths:
      - 'research-tools/filtered_operation_complex/**'
      - 'research-notes/p6-chart-correspondence/synthetic_k4_contract.json'
      - '.github/workflows/filtered-operation-complex.yml'
  workflow_dispatch:

concurrency:
  group: filtered-operation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run exact unit tests
        run: |
          python -m unittest discover \
            -s research-tools/filtered_operation_complex/tests \
            -p 'test_*.py' \
            -v

      - name: Replay the generic two-chart example
        env:
          PYTHONPATH: research-tools
        run: |
          python -m filtered_operation_complex \
            research-tools/filtered_operation_complex/examples/two_chart_rational.json \
            --output /tmp/two-chart-report.json

      - name: Adapt the Program 6 synthetic k=4 contract
        env:
          PYTHONPATH: research-tools
        run: |
          python -m filtered_operation_complex.adapters.program6_legacy \
            research-notes/p6-chart-correspondence/synthetic_k4_contract.json \
            --output /tmp/program6-report.json \
            --emit-contract /tmp/program6-contract.json

      - name: Replay the Program 5 adapter template
        env:
          PYTHONPATH: research-tools
        run: |
          python -m filtered_operation_complex.adapters.program5_row_killing \
            research-tools/filtered_operation_complex/examples/program5_row_killing_template.json \
            --output /tmp/program5-report.json \
            --emit-contract /tmp/program5-contract.json

      - name: Install the pinned Program 5 symbolic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'

      - name: Export the exact public Program 5 compression complex
        env:
          PYTHONPATH: research-tools
        run: |
          python -m filtered_operation_complex.adapters.program5_compression_export \
            --contract /tmp/program5-compression-contract.json \
            --report /tmp/program5-compression-report.json \
            --summary /tmp/program5-compression-summary.json
          python -m filtered_operation_complex \
            /tmp/program5-compression-contract.json \
            --output /tmp/program5-compression-generic-replay.json

      - name: Analyze the Program 5 row-zero to rank-six tangent bridge
        env:
          PYTHONPATH: research-tools
        run: |
          python -m filtered_operation_complex.adapters.program5_tangent_bridge \
            --output /tmp/program5-tangent-bridge.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/program5-tangent-bridge.json'))
          quartic = data['quartic_restriction']
          print(json.dumps({
              'tangent_excess_dimension': data['tangent_excess_dimension'],
              'extra_plane_expression': quartic['extra_plane_expression'],
              'linear_coefficients': quartic['linear_coefficients_in_eta_coordinates'],
              'extra_hessian': quartic['extra_hessian'],
              'pure_extra_term_count': len(quartic['pure_extra_terms']),
              'mixed_term_count': len(quartic['mixed_row_extra_terms']),
              'rational_cancellation': quartic['rational_cancellation_on_complement_plane'],
          }, indent=2, sort_keys=True))
          PY

      - name: Compute the second-order rank-six Kuranishi map
        env:
          PYTHONPATH: research-tools
        run: |
          python -m filtered_operation_complex.adapters.program5_rank_six_second_order \
            --output /tmp/program5-rank-six-second-order.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/program5-rank-six-second-order.json'))
          kur = data['quadratic_kuranishi']
          ratios = data['projective_eta_ratio_analysis']
          print(json.dumps({
              'obstruction_coefficient_rank': kur['obstruction_coefficient_rank'],
              'independent_equation_count': kur['independent_equation_count'],
              'nonzero_obstruction_monomials': kur['nonzero_obstruction_monomials'],
              'equations': kur['equations'],
              'u_axis': ratios['u_axis'],
              'v_axis': ratios['v_axis'],
              'generic_v_nonzero': ratios['generic_v_nonzero'],
              'rational_samples': ratios['rational_samples'],
          }, indent=2, sort_keys=True))
          PY

      - name: Construct the deterministic two-parameter rank-six lift
        env:
          PYTHONPATH: research-tools
        run: |
          python -m filtered_operation_complex.adapters.program5_rank_six_formal_arc \
            --max-order 6 \
            --output /tmp/program5-rank-six-formal-arc.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/program5-rank-six-formal-arc.json'))
          print(json.dumps({
              'maximum_compatible_order': data['maximum_compatible_order'],
              'first_obstructed_order': data['first_obstructed_order'],
              'orders': [
                  {
                      'order': item['order'],
                      'compatible': item['compatible'],
                      'obstruction_rank': item.get('obstruction_rank'),
                      'obstructed_monomials': item.get('obstructed_monomials', []),
                      'correction_nonzero_counts': [
                          correction['nonzero_count']
                          for correction in item.get('corrections', [])
                      ],
                  }
                  for item in data['orders']
              ],
          }, indent=2, sort_keys=True))
          PY

      - name: Verify the intrinsic cubic obstruction for the selected plane
        env:
          PYTHONPATH: research-tools
        run: |
          python -m unittest discover \
            -s research-tools/filtered_operation_complex/symbolic_tests \
            -p 'test_*.py' -v
