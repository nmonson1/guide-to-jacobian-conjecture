name: Program 6 archive intake

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p6-archive-intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  distill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Rebuild the temporary archive inventory
        run: |
          python research-notes/p6-chart-correspondence/archive_intake.py \
            docs-v7-20260726c/assets/technical-materials/06-plane-boundary-computational-supplement.zip \
            research-notes/p6-chart-correspondence/archive-scan \
            --config research-notes/p6-chart-correspondence/archive_intake_config.json \
            --expected-sha256 4238149caa6e8a73723368e997b8c714a99258600268f14a008c5e514ecea585

      - name: Distill and verify the degree-21 replay fixture
        run: |
          mkdir -p research-notes/p6-chart-correspondence/fixtures
          cp \
            research-notes/p6-chart-correspondence/archive-scan/selected/06-plane-boundary-computational-supplement/computational-supplement/degree-twenty-one/exact_data.json \
            research-notes/p6-chart-correspondence/fixtures/degree21_exact_data.json
          echo \
            'a506ccf4a8b97801b1a450609aa98382ef151d83c48b765270c37fbe7cb371f2  research-notes/p6-chart-correspondence/fixtures/degree21_exact_data.json' \
            | sha256sum --check --strict

      - name: Replay all archived degree-21 linear layers
        run: |
          python research-notes/p6-chart-correspondence/degree21_linear_replay.py \
            research-notes/p6-chart-correspondence/fixtures/degree21_exact_data.json \
            --output research-notes/p6-chart-correspondence/degree21_linear_replay.json

      - name: Decompose the archived kernels by common-root defect
        run: |
          python research-notes/p6-chart-correspondence/degree21_kernel_decomposition.py \
            research-notes/p6-chart-correspondence/fixtures/degree21_exact_data.json \
            --output research-notes/p6-chart-correspondence/degree21_kernel_decomposition.json

      - name: Run all exact diagnostic tests
        run: |
          python -m unittest discover \
            -s research-notes/p6-chart-correspondence \
            -p 'test_*.py' \
            -v

      - name: Remove the temporary intake machinery
        run: |
          rm -rf research-notes/p6-chart-correspondence/archive-scan
          git rm \
            .github/workflows/p6-archive-intake.yml \
            research-notes/p6-chart-correspondence/archive_intake.py \
            research-notes/p6-chart-correspondence/archive_intake_config.json

      - name: Commit the distilled replay package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Distill Program 6 replay fixture'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
