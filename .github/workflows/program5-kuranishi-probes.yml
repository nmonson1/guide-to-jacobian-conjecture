name: Probe Program 5 Kuranishi branches

on:
  pull_request:
    paths:
      - 'research-tools/filtered_operation_complex/adapters/program5_rank_six_*.py'
      - 'research-tools/filtered_operation_complex/symbolic_tests/test_program5_*.py'
      - '.github/workflows/program5-kuranishi-probes.yml'
  push:
    branches: [agent/p6-chart-correspondence]
    paths:
      - 'research-tools/filtered_operation_complex/adapters/program5_rank_six_*.py'
      - 'research-tools/filtered_operation_complex/symbolic_tests/test_program5_*.py'
      - '.github/workflows/program5-kuranishi-probes.yml'
  workflow_dispatch:

concurrency:
  group: program5-kuranishi-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generic-finite-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned symbolic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Compute the symbolic finite-ratio obstruction
        env:
          PYTHONPATH: research-tools
        run: |
          python -m unittest discover \
            -s research-tools/filtered_operation_complex/symbolic_tests \
            -p 'test_program5_generic_line_obstruction.py' -v
      - name: Audit the exceptional algebraic finite slopes
        env:
          PYTHONPATH: research-tools
        run: |
          python -m unittest discover \
            -s research-tools/filtered_operation_complex/symbolic_tests \
            -p 'test_program5_exceptional_finite_lines.py' -v

  first-order-row-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned symbolic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Scan the first-order row-base fibres
        env:
          PYTHONPATH: research-tools
        run: |
          python -m unittest discover \
            -s research-tools/filtered_operation_complex/symbolic_tests \
            -p 'test_program5_first_order_base_scan.py' -v

  exceptional-infinity-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned symbolic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Lift the deterministic point-at-infinity section
        env:
          PYTHONPATH: research-tools
        run: |
          python -m unittest discover \
            -s research-tools/filtered_operation_complex/symbolic_tests \
            -p 'test_program5_rank_six_line_formal_arc.py' -v

  infinity-row-base-formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned symbolic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Lift deterministic infinity-fibre coordinate sections
        env:
          PYTHONPATH: research-tools
        run: |
          python -m unittest discover \
            -s research-tools/filtered_operation_complex/symbolic_tests \
            -p 'test_program5_infinity_fibre_formal_scan.py' -v

  intrinsic-fourth-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned symbolic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Retain the full cubic-lift fibre at order four
        env:
          PYTHONPATH: research-tools
        run: |
          python -m unittest discover \
            -s research-tools/filtered_operation_complex/symbolic_tests \
            -p 'test_program5_fourth_order_kuranishi.py' -v
