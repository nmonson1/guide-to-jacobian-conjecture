name: Generate degree-21 lower-face fixtures

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p6-lower-face-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Run the exact test suite
        run: |
          python -m unittest discover \
            -s research-notes/p6-chart-correspondence \
            -p 'test_*.py' \
            -v

      - name: Extract lower-face normal support windows
        run: |
          python research-notes/p6-chart-correspondence/lower_face_supports.py \
            research-notes/p6-chart-correspondence/fixtures/degree21_exact_data.json \
            --output research-notes/p6-chart-correspondence/lower_face_supports.json

      - name: Rebuild the exact degree-21 leading face
        run: |
          rm -rf /tmp/degree21-belyi
          python research-notes/p6-chart-correspondence/fixtures/build_exact_belyi.py \
            --output-dir /tmp/degree21-belyi
          cp /tmp/degree21-belyi/exact_belyi_data.json \
            research-notes/p6-chart-correspondence/fixtures/exact_belyi_data.json
          sha256sum research-notes/p6-chart-correspondence/fixtures/exact_belyi_data.json \
            > research-notes/p6-chart-correspondence/fixtures/exact_belyi_data.sha256

      - name: Replay the lower-face linear quotients
        run: |
          python research-notes/p6-chart-correspondence/degree21_lower_face_replay.py \
            research-notes/p6-chart-correspondence/fixtures/exact_belyi_data.json \
            research-notes/p6-chart-correspondence/lower_face_supports.json \
            --output research-notes/p6-chart-correspondence/degree21_lower_face_replay.json
          python research-notes/p6-chart-correspondence/degree21_lower_face_full_gauge.py \
            research-notes/p6-chart-correspondence/fixtures/exact_belyi_data.json \
            research-notes/p6-chart-correspondence/lower_face_supports.json \
            --output research-notes/p6-chart-correspondence/degree21_lower_face_full_gauge.json
          python research-notes/p6-chart-correspondence/degree21_subgroup_ladder.py \
            research-notes/p6-chart-correspondence/fixtures/exact_belyi_data.json \
            research-notes/p6-chart-correspondence/lower_face_supports.json \
            --output research-notes/p6-chart-correspondence/degree21_subgroup_ladder.json

      - name: Scan small archive sources for the C.9 calculation
        run: |
          python - <<'PY'
          import json
          import re
          import zipfile
          from pathlib import Path

          archive = Path('docs-v7-20260726c/assets/technical-materials/06-plane-boundary-computational-supplement.zip')
          output = Path('research-notes/p6-chart-correspondence/archive_c9_candidates.json')
          expressions = {
              'residual_dimensions': re.compile(r'residual\s+dimensions?', re.I),
              'weighted_divergence': re.compile(r'weighted[-_ ]?divergence|\\mathcal\s*D.*Theta', re.I),
              'layer_four': re.compile(r'layer[-_ ]?(four|4)', re.I),
              'two_chart': re.compile(r'two[-_ ]?chart|adjacent\s+Newton\s+chart', re.I),
              'x_minus_four': re.compile(r'X\s*(\^|\*\*)\s*\{?\s*-?4|X\s*\*\*\s*-4', re.I),
              'complete_chain': re.compile(r'complete[-_ ]?chain', re.I),
          }
          suffixes = {'.py', '.sage', '.m', '.md', '.tex', '.txt', '.json', '.log'}
          members = []
          with zipfile.ZipFile(archive) as handle:
              for info in handle.infolist():
                  path = Path(info.filename)
                  if info.is_dir() or path.suffix.lower() not in suffixes or info.file_size > 2_000_000:
                      continue
                  text = handle.read(info).decode('utf-8', errors='replace')
                  hits = []
                  for label, expression in expressions.items():
                      match = expression.search(text)
                      if match:
                          line = text.count('\n', 0, match.start()) + 1
                          snippet = ' '.join(text[match.start():match.start()+300].split())
                          hits.append({'label': label, 'line': line, 'snippet': snippet})
                  if hits:
                      members.append({'path': info.filename, 'bytes': info.file_size, 'hits': hits})
          output.write_text(json.dumps({
              'schema_version': 2,
              'archive_sha256': '4238149caa6e8a73723368e997b8c714a99258600268f14a008c5e514ecea585',
              'member_count': len(members),
              'members': members,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Commit deterministic outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            research-notes/p6-chart-correspondence/lower_face_supports.json \
            research-notes/p6-chart-correspondence/fixtures/exact_belyi_data.json \
            research-notes/p6-chart-correspondence/fixtures/exact_belyi_data.sha256 \
            research-notes/p6-chart-correspondence/degree21_lower_face_replay.json \
            research-notes/p6-chart-correspondence/degree21_lower_face_full_gauge.json \
            research-notes/p6-chart-correspondence/degree21_subgroup_ladder.json \
            research-notes/p6-chart-correspondence/archive_c9_candidates.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Refresh degree-21 lower-face replay'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
