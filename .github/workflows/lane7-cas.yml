name: Lane 7 exact geometry

on:
  pull_request:
    paths:
      - "data/model-handoffs-v19-20260802a/lane-7-source-packet.md"
      - "research-notes/lane7-projective-kernel-20260802/**"
      - ".github/workflows/lane7-cas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packet-and-interface:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install symbolic test dependency
        run: python -m pip install --disable-pip-version-check "sympy==1.14.0"
      - name: Extract and hash-check the pinned Lane 7 sources
        run: |
          python research-notes/lane7-projective-kernel-20260802/extract_embedded_sources.py \
            --output-dir build/lane7-sources \
            lane7-split-incidence-20260802-v1/collision_residual_matrix_M.json \
            lane7-split-incidence-20260802-v1/Hv10_split_matrix_factorization.json \
            lane7-split-incidence-20260802-v1/verify_split_incidence_report.json \
            lane7-split-incidence-20260802-v1/verify_split_determinants_report.json
      - name: Inspect exact matrix schemas
        run: python research-notes/lane7-projective-kernel-20260802/inspect_packet.py build/lane7-sources
      - name: Verify Pluecker transport identities
        run: python research-notes/lane7-projective-kernel-20260802/test_plucker_transport.py
      - name: Generate standalone Macaulay2 inputs
        run: |
          python -m py_compile research-notes/lane7-projective-kernel-20260802/*.py
          python research-notes/lane7-projective-kernel-20260802/generate_macaulay2_input.py \
            build/lane7-sources build/lane7-qq-local.m2 --with-localizer
          python research-notes/lane7-projective-kernel-20260802/generate_macaulay2_input.py \
            build/lane7-sources build/lane7-char11.m2 --characteristic 11
          python research-notes/lane7-projective-kernel-20260802/generate_macaulay2_input.py \
            build/lane7-sources build/lane7-char101-local.m2 \
            --characteristic 101 --with-localizer
      - uses: actions/upload-artifact@v4
        with:
          name: lane7-exact-inputs
          path: |
            build/lane7-sources
            build/lane7-qq-local.m2
            build/lane7-char11.m2
            build/lane7-char101-local.m2
          if-no-files-found: error

  macaulay2-smoke:
    needs: packet-and-interface
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lane7-exact-inputs
          path: build
      - name: Install Macaulay2
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2
          M2 --version
      - name: Verify the known smooth-point rank input over F_11
        run: |
          cat > build/smoke.m2 <<'EOF'
          load "build/lane7-char11.m2";
          kk = ZZ/11;
          phi = map(kk,R,{8,7,1,7,2,9,0});
          N = phi M;
          print("D_AT_POINT=" | toString(phi d));
          print("RANK_AT_POINT=" | toString(rank N));
          assert(phi d == 1_kk);
          assert(rank N == 4);
          EOF
          M2 --script build/smoke.m2

  i4-char101:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[lane7-heavy]')
    needs: packet-and-interface
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lane7-exact-inputs
          path: build
      - name: Install Macaulay2
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2
          M2 --version
      - name: Test the corank-two locus on D(d) over F_101
        run: |
          cat > build/i4-char101.m2 <<'EOF'
          load "build/lane7-char101-local.m2";
          print "I4_CHAR101_BEGIN";
          I4 = minors(4,M,Strategy=>Dynamic);
          J4 = I4 + ideal(localizerEquation);
          G4 = gb J4;
          unit4 = (J4 == 1);
          print("I4_LOCAL_UNIT=" | toString unit4);
          assert unit4;
          print "I4_CHAR101_END";
          EOF
          M2 --script build/i4-char101.m2 | tee build/i4-char101.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane7-i4-char101
          path: build/i4-char101.*
          if-no-files-found: warn

  i5-char101:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[lane7-heavy]')
    needs: packet-and-interface
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lane7-exact-inputs
          path: build
      - name: Install Macaulay2
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2
          M2 --version
      - name: Compute localized maximal-minor data over F_101
        run: |
          cat > build/i5-char101.m2 <<'EOF'
          load "build/lane7-char101-local.m2";
          print "I5_CHAR101_BEGIN";
          I5 = minors(5,M,Strategy=>Dynamic);
          J5 = I5 + ideal(localizerEquation);
          G5 = gb J5;
          dim5 = dim J5;
          codim5 = codim J5;
          degree5 = degree J5;
          print("I5_LOCAL_DIM=" | toString dim5);
          print("I5_LOCAL_CODIM_IN_8_VARIABLE_RING=" | toString codim5);
          print("I5_LOCAL_GRADE_IN_A_D=" | toString(codim5-1));
          print("I5_LOCAL_DEGREE=" | toString degree5);
          assert(dim5 == 1);
          assert(codim5 == 7);
          print "I5_CHAR101_END";
          EOF
          M2 --script build/i5-char101.m2 | tee build/i5-char101.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane7-i5-char101
          path: build/i5-char101.*
          if-no-files-found: warn
