name: Lane 8 full-root queue audit

on:
  pull_request:
    paths:
      - "data/model-handoffs-v20-20260802c/lane-8-source-packet.md"
      - "data/model-handoffs-v20-20260802c/lane-8-reconstruction-input.md"
      - "research-notes/lane8-full-root-20260802/**"
      - ".github/workflows/lane8-full-root.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-and-discover:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact symbolic dependency
        run: python -m pip install --disable-pip-version-check "sympy==1.14.0"
      - name: Compile the audit harness
        run: python -m py_compile research-notes/lane8-full-root-20260802/*.py
      - name: Extract and hash-check public Lane 8 sources
        run: |
          python research-notes/lane8-full-root-20260802/extract_embedded_sources.py \
            --output-dir build/lane8-source
      - name: Compile every recovered Python program
        run: |
          find build/lane8-source -name '*.py' -print0 \
            | xargs -0 -r python -m py_compile
      - name: Discover exact executable interfaces
        run: |
          python research-notes/lane8-full-root-20260802/discover_entrypoints.py \
            build/lane8-source build/lane8-discovery.json
      - name: Fetch and hash-check the public Program 6 supplement
        run: |
          python research-notes/lane8-full-root-20260802/fetch_program6_supplement.py \
            --archive build/program6-supplement.zip \
            --output-dir build/program6-supplement \
            --listing build/program6-supplement-listing.json
      - uses: actions/upload-artifact@v4
        with:
          name: lane8-public-exact-sources
          path: |
            build/lane8-source
            build/lane8-discovery.json
            build/program6-supplement.zip
            build/program6-supplement
            build/program6-supplement-listing.json
          if-no-files-found: error
