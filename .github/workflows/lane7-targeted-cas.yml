name: Lane 7 targeted exact certificates

on:
  pull_request:
    paths:
      - "data/model-handoffs-v19-20260802a/lane-7-source-packet.md"
      - "research-notes/lane7-projective-kernel-20260802/**"
      - ".github/workflows/lane7-targeted-cas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract the hash-pinned matrix and generate exact inputs
        run: |
          python research-notes/lane7-projective-kernel-20260802/extract_embedded_sources.py \
            --output-dir build/lane7-sources \
            lane7-split-incidence-20260802-v1/collision_residual_matrix_M.json \
            lane7-split-incidence-20260802-v1/Hv10_split_matrix_factorization.json
          python research-notes/lane7-projective-kernel-20260802/generate_macaulay2_input.py \
            build/lane7-sources build/lane7-qq-local-cleared.m2 \
            --with-localizer --clear-row-denominators
          python research-notes/lane7-projective-kernel-20260802/generate_macaulay2_input.py \
            build/lane7-sources build/lane7-char5-local-cleared.m2 \
            --characteristic 5 --with-localizer --clear-row-denominators
          python research-notes/lane7-projective-kernel-20260802/generate_macaulay2_input.py \
            build/lane7-sources build/lane7-char32003-local-cleared.m2 \
            --characteristic 32003 --with-localizer --clear-row-denominators
      - uses: actions/upload-artifact@v4
        with:
          name: lane7-targeted-inputs
          path: build/lane7-*-local-cleared.m2
          if-no-files-found: error

  i4-small-qq:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lane7-targeted-inputs
          path: build
      - name: Install Macaulay2
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2
          M2 --version | tee build/macaulay2-version.txt
      - name: Test eleven four-minor generators on D(d) over QQ
        run: |
          set -o pipefail
          cat > build/i4-small-qq.m2 <<'EOF'
          load "build/lane7-qq-local-cleared.m2";
          print "I4_SMALL_QQ_BEGIN";
          selected4 = {
            det submatrix(M,{0,1,2,4},{0,1,3,4}),
            det submatrix(M,{0,1,2,3},{0,2,3,4}),
            det submatrix(M,{0,2,3,4},{1,2,3,4}),
            det submatrix(M,{1,2,3,4},{0,1,2,3}),
            det submatrix(M,{0,1,3,4},{0,1,2,4}),
            det submatrix(M,{0,2,4,6},{0,2,3,4}),
            det submatrix(M,{1,2,3,5},{1,2,3,4}),
            det submatrix(M,{0,1,4,6},{0,1,2,3}),
            det submatrix(M,{0,1,3,6},{1,2,3,4}),
            det submatrix(M,{2,3,4,5},{0,1,2,3}),
            det submatrix(M,{0,1,3,7},{0,1,2,3})
          };
          J4small = ideal selected4 + ideal(localizerEquation);
          unit4small = (J4small == 1);
          print("I4_SMALL_LOCAL_UNIT_QQ=" | toString unit4small);
          assert unit4small;
          print "I4_SMALL_QQ_END";
          EOF
          M2 --script build/i4-small-qq.m2 2>&1 | tee build/i4-small-qq.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane7-i4-small-qq
          path: |
            build/macaulay2-version.txt
            build/i4-small-qq.*
          if-no-files-found: warn

  i4-small-char5:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lane7-targeted-inputs
          path: build
      - name: Install Macaulay2
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2
      - name: Test the same four-minor generators over F_5
        run: |
          set -o pipefail
          cat > build/i4-small-char5.m2 <<'EOF'
          load "build/lane7-char5-local-cleared.m2";
          selected4 = {
            det submatrix(M,{0,1,2,4},{0,1,3,4}),
            det submatrix(M,{0,1,2,3},{0,2,3,4}),
            det submatrix(M,{0,2,3,4},{1,2,3,4}),
            det submatrix(M,{1,2,3,4},{0,1,2,3}),
            det submatrix(M,{0,1,3,4},{0,1,2,4}),
            det submatrix(M,{0,2,4,6},{0,2,3,4}),
            det submatrix(M,{1,2,3,5},{1,2,3,4}),
            det submatrix(M,{0,1,4,6},{0,1,2,3}),
            det submatrix(M,{0,1,3,6},{1,2,3,4}),
            det submatrix(M,{2,3,4,5},{0,1,2,3}),
            det submatrix(M,{0,1,3,7},{0,1,2,3})
          };
          J4small = ideal selected4 + ideal(localizerEquation);
          unit4small = (J4small == 1);
          print("I4_SMALL_LOCAL_UNIT_CHAR5=" | toString unit4small);
          assert unit4small;
          EOF
          M2 --script build/i4-small-char5.m2 2>&1 | tee build/i4-small-char5.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane7-i4-small-char5
          path: build/i4-small-char5.*
          if-no-files-found: warn

  i5-six-grade-qq:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lane7-targeted-inputs
          path: build
      - name: Install Macaulay2
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2
          M2 --version | tee build/macaulay2-version.txt
      - name: Test six diverse maximal minors over QQ
        run: |
          set -o pipefail
          cat > build/i5-six-grade-qq.m2 <<'EOF'
          load "build/lane7-qq-local-cleared.m2";
          print "I5_SIX_GRADE_QQ_BEGIN";
          selected5 = {
            det submatrix(M,{0,1,4,7,8},{0..4}),
            det submatrix(M,{1,2,3,7,9},{0..4}),
            det submatrix(M,{0,2,3,4,9},{0..4}),
            det submatrix(M,{2,5,7,8,9},{0..4}),
            det submatrix(M,{0,1,3,5,6},{0..4}),
            det submatrix(M,{2,4,5,6,7},{0..4})
          };
          K5 = ideal selected5 + ideal(localizerEquation);
          dimK5 = dim K5;
          codimK5 = codim K5;
          print("I5_SIX_LOCAL_DIM_QQ=" | toString dimK5);
          print("I5_SIX_LOCAL_CODIM_IN_8_VARIABLE_RING_QQ=" | toString codimK5);
          print("I5_SIX_LOCAL_HEIGHT_IN_A_D_QQ=" | toString(codimK5-1));
          assert(dimK5 == 1);
          assert(codimK5 == 7);
          print "I5_SIX_GRADE_QQ_END";
          EOF
          M2 --script build/i5-six-grade-qq.m2 2>&1 | tee build/i5-six-grade-qq.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane7-i5-six-grade-qq
          path: |
            build/macaulay2-version.txt
            build/i5-six-grade-qq.*
          if-no-files-found: warn

  i5-six-grade-char32003:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lane7-targeted-inputs
          path: build
      - name: Install Macaulay2
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2
      - name: Test six diverse maximal minors over F_32003
        run: |
          set -o pipefail
          cat > build/i5-six-grade-char32003.m2 <<'EOF'
          load "build/lane7-char32003-local-cleared.m2";
          selected5 = {
            det submatrix(M,{0,1,4,7,8},{0..4}),
            det submatrix(M,{1,2,3,7,9},{0..4}),
            det submatrix(M,{0,2,3,4,9},{0..4}),
            det submatrix(M,{2,5,7,8,9},{0..4}),
            det submatrix(M,{0,1,3,5,6},{0..4}),
            det submatrix(M,{2,4,5,6,7},{0..4})
          };
          K5 = ideal selected5 + ideal(localizerEquation);
          dimK5 = dim K5;
          codimK5 = codim K5;
          print("I5_SIX_LOCAL_DIM_CHAR32003=" | toString dimK5);
          print("I5_SIX_LOCAL_CODIM_IN_8_VARIABLE_RING_CHAR32003=" | toString codimK5);
          assert(dimK5 == 1);
          assert(codimK5 == 7);
          EOF
          M2 --script build/i5-six-grade-char32003.m2 2>&1 | tee build/i5-six-grade-char32003.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane7-i5-six-grade-char32003
          path: build/i5-six-grade-char32003.*
          if-no-files-found: warn
