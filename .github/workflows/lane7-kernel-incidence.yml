name: Lane 7 projective-kernel dimension

on:
  pull_request:
    paths:
      - "data/model-handoffs-v19-20260802a/lane-7-source-packet.md"
      - "research-notes/lane7-projective-kernel-20260802/**"
      - ".github/workflows/lane7-kernel-incidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact input dependency
        run: python -m pip install --disable-pip-version-check "sympy==1.14.0"
      - name: Extract the exact residual matrix
        run: |
          python research-notes/lane7-projective-kernel-20260802/extract_embedded_sources.py \
            --output-dir build/lane7-sources \
            lane7-split-incidence-20260802-v1/collision_residual_matrix_M.json \
            lane7-split-incidence-20260802-v1/Hv10_split_matrix_factorization.json
      - name: Generate all five canonical kernel charts over F_5
        run: |
          set -euo pipefail
          for chart in 0 1 2 3 4; do
            python research-notes/lane7-projective-kernel-20260802/generate_kernel_chart_input.py \
              build/lane7-sources "build/kernel-chart-${chart}-char5.m2" \
              --chart "${chart}" --characteristic 5
            python research-notes/lane7-projective-kernel-20260802/generate_kernel_chart_singular.py \
              build/lane7-sources "build/kernel-chart-${chart}-char5.sing" \
              --chart "${chart}" --characteristic 5
          done
          python -m py_compile research-notes/lane7-projective-kernel-20260802/*.py
      - uses: actions/upload-artifact@v4
        with:
          name: lane7-kernel-chart-inputs
          path: |
            build/kernel-chart-*-char5.m2
            build/kernel-chart-*-char5.sing
          if-no-files-found: error

  macaulay2-kernel-chart-char5:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chart: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lane7-kernel-chart-inputs
          path: build
      - name: Install Macaulay2
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2
          M2 --version | tee build/macaulay2-version.txt
      - name: Bound the dimension of kernel chart ${{ matrix.chart }}
        run: |
          set -o pipefail
          M2 --script "build/kernel-chart-${{ matrix.chart }}-char5.m2" 2>&1 \
            | tee "build/kernel-chart-${{ matrix.chart }}-char5-m2.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane7-kernel-chart-${{ matrix.chart }}-char5-m2
          path: |
            build/macaulay2-version.txt
            build/kernel-chart-${{ matrix.chart }}-char5.m2
            build/kernel-chart-${{ matrix.chart }}-char5-m2.log
          if-no-files-found: warn

  singular-kernel-chart-char5:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chart: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lane7-kernel-chart-inputs
          path: build
      - name: Install Singular
        run: |
          sudo apt-get update
          sudo apt-get install -y singular
          Singular --version | tee build/singular-version.txt
      - name: Bound the dimension of kernel chart ${{ matrix.chart }}
        run: |
          set -o pipefail
          Singular "build/kernel-chart-${{ matrix.chart }}-char5.sing" 2>&1 \
            | tee "build/kernel-chart-${{ matrix.chart }}-char5-singular.log"
          grep -Eq \
            "KERNEL_CHART_${{ matrix.chart }}_CHAR_5_SINGULAR_DIM=(-1|0|1)$" \
            "build/kernel-chart-${{ matrix.chart }}-char5-singular.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane7-kernel-chart-${{ matrix.chart }}-char5-singular
          path: |
            build/singular-version.txt
            build/kernel-chart-${{ matrix.chart }}-char5.sing
            build/kernel-chart-${{ matrix.chart }}-char5-singular.log
          if-no-files-found: warn
