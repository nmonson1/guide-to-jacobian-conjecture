name: Lane 7 source inventory

on:
  pull_request:
    paths:
      - ".github/workflows/lane7-source-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Locate first-normal and dimension-five source files
        shell: bash
        run: |
          mkdir -p build
          {
            echo "# filenames"
            find . -type f \
              | grep -Ei 'first[-_ ]?normal|normal[-_ ]?first|dimension[-_ ]?five|full[-_ ]?kernel' \
              | sort || true
            echo
            echo "# text matches"
            grep -RInE --exclude-dir=.git --exclude='lane7-source-inventory.txt' \
              'first[- ]normal|first_normal|60,61|125,126|n5-first-normal|n5-regular-family' \
              . || true
          } > build/lane7-source-inventory.txt
          sed -n '1,240p' build/lane7-source-inventory.txt
      - name: Extract the hash-pinned Program 5 computational supplement
        shell: bash
        run: |
          expected=0570a676633bef822a67ca93f576a6cb4cb79bac3301a7f515881a612c77d866
          find . -type f -name '05-homogeneous-descendants-computational-supplement.zip' \
            -print0 | xargs -0 sha256sum | sort -k2 > build/program5-archives.sha256
          archive=$(awk -v expected="$expected" '$1 == expected {sub(/^[^ ]+  /, ""); print; exit}' \
            build/program5-archives.sha256)
          test -n "$archive"
          mkdir -p build/program5-supplement
          unzip -q "$archive" -d build/program5-supplement
          find build/program5-supplement -type f -printf '%P\n' | sort \
            > build/program5-supplement-files.txt
          cat build/program5-archives.sha256
          cat build/program5-supplement-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lane7-source-inventory
          path: |
            build/lane7-source-inventory.txt
            build/program5-archives.sha256
            build/program5-supplement-files.txt
            build/program5-supplement
          if-no-files-found: error
