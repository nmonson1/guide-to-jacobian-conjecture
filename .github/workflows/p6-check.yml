name: Pin degree-21 Belyi field inputs

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Extract and verify the small field fixtures
        run: |
          archive=docs-v7-20260726c/assets/technical-materials/06-plane-boundary-computational-supplement.zip
          out=research-notes/p6-chart-correspondence/fixtures
          mkdir -p "$out"
          unzip -p "$archive" \
            06-plane-boundary-computational-supplement/degree-296-large/inputs/handoff-lite/layer-calculation/belyi_exact_field_relations.json \
            > "$out/belyi_exact_field_relations.json"
          unzip -p "$archive" \
            06-plane-boundary-computational-supplement/computational-supplement/degree-twenty-one/build_exact_belyi.py \
            > "$out/build_exact_belyi.py"
          unzip -p "$archive" \
            06-plane-boundary-computational-supplement/computational-supplement/degree-twenty-one/deeper_exact_reduction.json \
            > "$out/deeper_exact_reduction.json"
          echo '5b4af2128b91aba7796660865a48fc4cc3d9a851521f45106acad74db7dbcb6d  research-notes/p6-chart-correspondence/fixtures/belyi_exact_field_relations.json' | sha256sum --check --strict
          echo '834850cfd30ebe3f73ff6497fd0c30898b6d917c632a1c7298716bdbf1c40183  research-notes/p6-chart-correspondence/fixtures/build_exact_belyi.py' | sha256sum --check --strict
          echo '7749b5c53cf9f5712da2d1ada2c29eebb6fd3a08e265141a4b636f0d77aaf162  research-notes/p6-chart-correspondence/fixtures/deeper_exact_reduction.json' | sha256sum --check --strict

      - name: Record provenance
        run: |
          cat > research-notes/p6-chart-correspondence/fixtures/belyi_field_fixture_provenance.json <<'JSON'
          {
            "schema_version": 1,
            "source_archive": {
              "repository_path": "docs-v7-20260726c/assets/technical-materials/06-plane-boundary-computational-supplement.zip",
              "sha256": "4238149caa6e8a73723368e997b8c714a99258600268f14a008c5e514ecea585"
            },
            "members": [
              {
                "fixture_path": "fixtures/belyi_exact_field_relations.json",
                "archive_path": "06-plane-boundary-computational-supplement/degree-296-large/inputs/handoff-lite/layer-calculation/belyi_exact_field_relations.json",
                "bytes": 3149,
                "sha256": "5b4af2128b91aba7796660865a48fc4cc3d9a851521f45106acad74db7dbcb6d"
              },
              {
                "fixture_path": "fixtures/build_exact_belyi.py",
                "archive_path": "06-plane-boundary-computational-supplement/computational-supplement/degree-twenty-one/build_exact_belyi.py",
                "bytes": 7313,
                "sha256": "834850cfd30ebe3f73ff6497fd0c30898b6d917c632a1c7298716bdbf1c40183"
              },
              {
                "fixture_path": "fixtures/deeper_exact_reduction.json",
                "archive_path": "06-plane-boundary-computational-supplement/computational-supplement/degree-twenty-one/deeper_exact_reduction.json",
                "bytes": 931,
                "sha256": "7749b5c53cf9f5712da2d1ada2c29eebb6fd3a08e265141a4b636f0d77aaf162"
              }
            ]
          }
          JSON

      - name: Re-run the exact diagnostic suite
        run: |
          python -m unittest discover \
            -s research-notes/p6-chart-correspondence \
            -p 'test_*.py' \
            -v

      - name: Commit fixtures and remove this temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/p6-check.yml
          git add research-notes/p6-chart-correspondence/fixtures
          git commit -m 'Pin degree-21 Belyi field fixtures'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
