<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Newton polygon for y squared minus x cubed minus x</title>
  <desc id="desc">Exponent points at zero two, one zero, and three zero. The compact edge between zero two and three zero has slope minus two thirds and predicts y of order x to the three halves.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#183638"/>
    </marker>
    <style>
      .axis{stroke:#183638;stroke-width:3;marker-end:url(#arrow)}
      .grid{stroke:#c8d1ce;stroke-width:1}
      .edge{stroke:#a63a30;stroke-width:6}
      .point{fill:#0d6567;stroke:#fff;stroke-width:3}
      .label{font:600 18px system-ui,sans-serif;fill:#183638}
      .small{font:500 16px system-ui,sans-serif;fill:#455f61}
    </style>
  </defs>
  <line x1="110" y1="340" x2="660" y2="340" class="axis"/>
  <line x1="110" y1="340" x2="110" y2="55" class="axis"/>
  <text x="665" y="348" class="label">x-exponent i</text>
  <text x="45" y="45" class="label">y-exponent j</text>

  <g>
    <line x1="250" y1="80" x2="250" y2="340" class="grid"/>
    <line x1="390" y1="80" x2="390" y2="340" class="grid"/>
    <line x1="530" y1="80" x2="530" y2="340" class="grid"/>
    <line x1="110" y1="210" x2="600" y2="210" class="grid"/>
    <line x1="110" y1="80" x2="600" y2="80" class="grid"/>
  </g>

  <line x1="110" y1="80" x2="530" y2="340" class="edge"/>
  <circle cx="110" cy="80" r="11" class="point"/>
  <circle cx="250" cy="340" r="11" class="point"/>
  <circle cx="530" cy="340" r="11" class="point"/>

  <text x="125" y="70" class="small">(0,2): y²</text>
  <text x="220" y="375" class="small">(1,0): x</text>
  <text x="500" y="375" class="small">(3,0): x³</text>
  <text x="320" y="155" class="label">slope = −2/3</text>
  <text x="322" y="184" class="label">so r = 3/2</text>
</svg>
