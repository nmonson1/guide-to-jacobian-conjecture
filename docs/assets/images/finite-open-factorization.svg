<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Finite cover and affine opening</title>
  <desc id="desc">A finite three-sheeted cover contains boundary points. Removing those points gives an affine open whose sheets can disappear over the boundary image.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0d6567"/>
    </marker>
    <style>
      .label{font:600 20px system-ui,sans-serif;fill:#183638}
      .small{font:500 16px system-ui,sans-serif;fill:#455f61}
      .sheet{fill:#e9f3f0;stroke:#0d6567;stroke-width:3}
      .target{fill:#f2eadc;stroke:#a63a30;stroke-width:3}
      .arrow{stroke:#0d6567;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .boundary{fill:#a63a30;stroke:#fff;stroke-width:3}
      .ghost{stroke:#a63a30;stroke-width:3;stroke-dasharray:8 7;fill:none}
    </style>
  </defs>
  <text x="105" y="38" class="label">affine opening U</text>
  <text x="420" y="38" class="label">finite normalization Z</text>
  <text x="790" y="38" class="label">target Y</text>

  <rect x="45" y="75" width="250" height="220" rx="24" class="sheet"/>
  <path d="M90 120 C155 85 225 85 260 120" class="ghost"/>
  <path d="M90 185 C155 150 225 150 260 185" class="ghost"/>
  <path d="M90 250 C155 215 225 215 260 250" class="ghost"/>
  <text x="81" y="326" class="small">ramification points deleted</text>

  <rect x="355" y="75" width="250" height="220" rx="24" class="sheet"/>
  <path d="M395 120 C455 85 525 85 565 120" fill="none" stroke="#0d6567" stroke-width="4"/>
  <path d="M395 185 C455 150 525 150 565 185" fill="none" stroke="#0d6567" stroke-width="4"/>
  <path d="M395 250 C455 215 525 215 565 250" fill="none" stroke="#0d6567" stroke-width="4"/>
  <circle cx="565" cy="120" r="10" class="boundary"/>
  <circle cx="565" cy="185" r="10" class="boundary"/>
  <circle cx="565" cy="250" r="10" class="boundary"/>
  <text x="406" y="326" class="small">boundary D = Z \ U retained</text>

  <rect x="725" y="75" width="190" height="220" rx="24" class="target"/>
  <line x1="760" y1="120" x2="880" y2="120" stroke="#a63a30" stroke-width="4"/>
  <line x1="760" y1="185" x2="880" y2="185" stroke="#a63a30" stroke-width="4"/>
  <line x1="760" y1="250" x2="880" y2="250" stroke="#a63a30" stroke-width="4"/>
  <circle cx="880" cy="185" r="11" class="boundary"/>
  <text x="755" y="326" class="small">boundary image</text>

  <path d="M300 185 L345 185" class="arrow"/>
  <text x="302" y="168" class="small">open</text>
  <path d="M615 185 L714 185" class="arrow"/>
  <text x="638" y="168" class="small">finite</text>
</svg>
