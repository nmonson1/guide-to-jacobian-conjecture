site_name: "The Jacobian Conjecture: A Guide"
site_url: https://nmonson1.github.io/guide-to-jacobian-conjecture/
site_description: A human-directed, owner-edited guide to the Jacobian conjecture, its counterexample in dimensions at least three, the surviving plane case, and the mathematics around them.
docs_dir: docs
repo_name: nmonson1/guide-to-jacobian-conjecture
repo_url: https://github.com/nmonson1/guide-to-jacobian-conjecture
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/mark.svg
  favicon: assets/images/mark.svg
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: jacobian-light
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: jacobian-dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# The editorial hook replaces this bootstrap navigation with the hand-authored
# navigation entries whose exact page versions have been owner-approved.
nav:
  - Draft home: index.md

# Every hand-authored page is built, even while it is deliberately absent from
# ordinary navigation. The editorial hook controls listing and search.
not_in_nav: |
  **/*

hooks:
  - hooks/editorial.py

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/exposition.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  status_date: 7 August 2026
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nmonson1/guide-to-jacobian-conjecture

copyright: Nathaniel Monson · Public working draft · Updated 7 August 2026.
