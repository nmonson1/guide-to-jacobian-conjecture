site_name: "The Jacobian Conjecture: A Living Guide"
site_url: https://nmonson1.github.io/guide-to-jacobian-conjecture/
site_description: A reader-first guide to the counterexample, its geometry, the surviving plane case, and the research it has opened.
docs_dir: docs-v5-20260726a
repo_name: nmonson1/guide-to-jacobian-conjecture
repo_url: https://github.com/nmonson1/guide-to-jacobian-conjecture
edit_uri: edit/main/docs-v5-20260726a/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/mark.svg
  favicon: assets/images/mark.svg
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: jacobian-light
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: jacobian-dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Start: index.md
  - Counterexample: counterexample.md
  - Geometry: geometry.md
  - Plane Case: plane-case.md
  - Research: research.md
  - About: about.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  status_date: 26 July 2026, Pacific time
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nmonson1/guide-to-jacobian-conjecture

copyright: Working draft updated 26 July 2026, Pacific time.
