{% extends "base.html" %}

{% block announce %}
<span class="announce-copy">
  Current through {{ config.extra.status_date }} · Six mathematical stories ·
  <a href="{{ 'stories-v1/' | url }}">Start reading</a>
</span>
{% endblock %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.meta and page.meta.robots %}
  <meta name="robots" content="{{ page.meta.robots }}">
  {% endif %}
  <meta name="theme-color" content="#123a3b">
  <meta name="author" content="Guide to the Jacobian Conjecture contributors">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Guide to the Jacobian Conjecture">
  <meta property="og:description" content="A reader guide and source-linked record of the Jacobian conjecture, its counterexample, and the questions that follow.">
  <meta property="og:url" content="https://nmonson1.github.io/guide-to-jacobian-conjecture/">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Guide to the Jacobian Conjecture",
    "url": "https://nmonson1.github.io/guide-to-jacobian-conjecture/",
    "description": "A reader guide and source-linked record of the Jacobian conjecture, its counterexample, and the questions that follow."
  }
  </script>
{% endblock %}
