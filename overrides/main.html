{% extends "base.html" %}

{% block announce %}
<span class="announce-copy">
  Public working draft · Reviewed pages are listed; other pages remain available by direct link
</span>
{% endblock %}

{% block extrahead %}
  {{ super() }}
  <meta name="robots" content="{{ page.meta.robots if page and page.meta and page.meta.robots else 'noindex, nofollow' }}">
  <meta name="theme-color" content="#123a3b">
  <meta name="author" content="Nathaniel Monson">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title if page else config.site_name }}">
  <meta property="og:description" content="{{ page.meta.description if page and page.meta and page.meta.description else config.site_description }}">
  <meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
{% endblock %}
